<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ace It</title>
<meta name="description" content="A private grade calculator and grade log for your degree. Everything stays on your device.">

<link rel="manifest" href="manifest.json">
<script>
  // Appearance is applied before anything paints: the app's own choice, or the phone's.
  (function () {
    var pref = null;
    try { pref = JSON.parse(localStorage.getItem('aceit.theme')); } catch (e) {}
    var dark = pref === 'dark' || (pref !== 'light' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.write('<meta name="theme-color" content="' + (dark ? '#141012' : '#FFFFFF') + '">' +
      '<meta name="apple-mobile-web-app-status-bar-style" content="' + (dark ? 'black' : 'default') + '">');
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ace It">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="sym-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="sym-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="sym-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="sym-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="sym-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="sym-overview" viewBox="0 0 24 24"><path d="M4 19.5h16"/><path d="M6.5 16V11M12 16V5.5M17.5 16v-7"/></symbol>
    <symbol id="sym-terms" viewBox="0 0 24 24"><rect x="4" y="4.5" width="16" height="15.5" rx="2.5"/><path d="M4 9.5h16M8.5 2.5v4M15.5 2.5v4"/></symbol>
    <symbol id="sym-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M5.6 18.4l1.6-1.6M16.8 7.2l1.6-1.6"/></symbol>
    <symbol id="sym-share" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a1 1 0 001 1h12a1 1 0 001-1v-7"/></symbol>
    <symbol id="sym-download" viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 19h14"/></symbol>
    <symbol id="sym-theme-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></symbol>
    <symbol id="sym-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5L7 7M17 17l1.5 1.5M5.5 18.5L7 17M17 7l1.5-1.5"/></symbol>
    <symbol id="sym-moon" viewBox="0 0 24 24"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/></symbol>
    <symbol id="sym-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4.5M12 17.2v.1"/></symbol>
    <symbol id="sym-book" viewBox="0 0 24 24"><path d="M12 6c-2-1.3-5-1.5-8-.6v13c3-.9 6-.7 8 .6 2-1.3 5-1.5 8-.6v-13c-3-.9-6-.7-8 .6z"/><path d="M12 6v13"/></symbol>
    <symbol id="sym-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".6" fill="currentColor"/></symbol>
    <symbol id="sym-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <section class="screen is-active" id="screen-overview" data-tab="overview"></section>
  <section class="screen" id="screen-terms" data-tab="terms"></section>
  <section class="screen" id="screen-settings" data-tab="settings"></section>
</div>

<nav class="tabbar" id="tabbar">
  <span class="tab-lens" id="tabLens" aria-hidden="true"></span>
  <button class="tab is-active" data-tab="overview"><svg><use href="#sym-overview"/></svg><span>Overview</span></button>
  <button class="tab" data-tab="terms"><svg><use href="#sym-terms"/></svg><span>Terms</span></button>
  <button class="tab" data-tab="settings"><svg><use href="#sym-settings"/></svg><span>Settings</span></button>
</nav>

<div id="setup" class="setup hidden" aria-live="polite"></div>

<div id="impact" class="impact hidden" role="status" aria-live="polite"></div>
<div id="toast" class="toast hidden"><span id="toastText"></span><button class="toast-action hidden" id="toastAction"></button></div>
<input type="file" id="restoreFile" accept="application/json,.json,text/plain" class="hidden">

<script src="grades.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
